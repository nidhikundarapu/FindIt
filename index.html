<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FindIt — Lost & Found Management System</title>
    <meta name="description"
        content="Smart Lost & Found platform — report, match, and recover lost items with AI-powered matching, role-based access, and secure case management.">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&display=swap"
        rel="stylesheet">

    <!-- Design System -->
    <link rel="stylesheet" href="css/design-system.css">

    <!-- Favicon -->
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%239f88e0%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><circle cx=%2211%22 cy=%2211%22 r=%228%22/><path d=%22m21 21-4.35-4.35%22/></svg>">
</head>

<body>
    <div id="app">
        <!-- Loading Splash -->
        <div
            style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#fdf5f7 0%,#f7f5fd 50%,#f3faf7 100%)">
            <div style="text-align:center">
                <div
                    style="width:56px;height:56px;border-radius:16px;background:#eee9fb;margin:0 auto 16px;display:flex;align-items:center;justify-content:center">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9f88e0" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8" />
                        <path d="m21 21-4.35-4.35" />
                    </svg>
                </div>
                <div style="font-family:'Poppins',sans-serif;font-size:22px;font-weight:700;color:#2d2440">FindIt</div>
                <div style="color:#9089a5;margin-top:6px;font-size:13px">Loading&hellip;</div>
            </div>
        </div>
    </div>

    <!-- Core App Engine -->
    <script src="js/app.js"></script>

    <!-- Page Modules -->
    <script src="js/pages-auth.js"></script>
    <script src="js/pages-browse.js"></script>
    <script src="js/pages-report.js"></script>
    <script src="js/pages-match.js"></script>
    <script src="js/pages-admin.js"></script>

    <!-- Boot -->
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await State.init();
            if (State.currentUser) {
                Router.go('dashboard');
            } else {
                Router.go('login');
            }
        });
    </script>
</body>

</html>
